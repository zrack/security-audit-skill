<svg xmlns="http://www.w3.org/2000/svg" width="880" height="453" viewBox="0 0 880 453" role="img" aria-labelledby="title description">
  <title id="title">From scope to report</title>
  <desc id="description">Four review stages. Scope the target and revision and collect relevant code and context. Trace inputs to sensitive actions across trust boundaries. Check existing safeguards, look for counterexamples, and identify gaps in evidence. Report supported impact, confidence, a correction, verification, and coverage limits.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 7 4.5 2 8" fill="none" stroke="#54728d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #112b3e; }
      .title { font-size: 39px; font-weight: 750; letter-spacing: -1.3px; }
      .label { font-size: 25px; font-weight: 700; letter-spacing: -.35px; }
      .detail { font-size: 20px; fill: #3d586d; }
      .edge { fill: none; stroke: #54728d; stroke-width: 2; marker-end: url(#arrow); }
      .icon { fill: none; stroke: #235a7b; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="451" rx="25" fill="#f6f8fc" stroke="#cbd7e3" stroke-width="2"/>
  <text x="36" y="66" class="title">From scope to report</text>

  <path d="M61 159V198" class="edge"/>
  <path d="M61 241V280" class="edge"/>
  <path d="M61 323V362" class="edge"/>

  <rect x="100" y="103" width="744" height="70" rx="12" fill="#fff" stroke="#cbd7e3"/>
  <rect x="39" y="116" width="44" height="44" rx="10" fill="#eaf1fb" stroke="#b4c9e0"/>
  <path d="M53 132v-4h4m8 0h4v4m0 9v4h-4m-8 0h-4v-4m5-4h6m-3-3v6" class="icon"/>
  <text x="120" y="147" class="label">Scope the review</text>
  <path d="M362 120V156" stroke="#d5dfe8"/>
  <text x="384" y="133" class="detail">Identify the target and revision.</text>
  <text x="384" y="157" class="detail">Read the relevant code and context.</text>

  <rect x="100" y="185" width="744" height="70" rx="12" fill="#fff" stroke="#cbd7e3"/>
  <rect x="39" y="198" width="44" height="44" rx="10" fill="#eaf1fb" stroke="#b4c9e0"/>
  <circle cx="54" cy="215" r="3" class="icon"/>
  <circle cx="68" cy="226" r="3" class="icon"/>
  <path d="M57 215h9v7M54 218v8h10" class="icon"/>
  <text x="120" y="229" class="label">Trace the path</text>
  <path d="M362 202V238" stroke="#d5dfe8"/>
  <text x="384" y="215" class="detail">Follow inputs to sensitive actions.</text>
  <text x="384" y="239" class="detail">Identify trust boundaries and prerequisites.</text>

  <rect x="100" y="267" width="744" height="70" rx="12" fill="#fff" stroke="#cbd7e3"/>
  <rect x="39" y="280" width="44" height="44" rx="10" fill="#eaf1fb" stroke="#b4c9e0"/>
  <circle cx="59" cy="299" r="7" class="icon"/>
  <path d="M64 304l6 6m-14-11 2 2 4-4" class="icon"/>
  <text x="120" y="311" class="label">Check the controls</text>
  <path d="M362 284V320" stroke="#d5dfe8"/>
  <text x="384" y="297" class="detail">Inspect safeguards and seek counterexamples.</text>
  <text x="384" y="321" class="detail">Identify evidence gaps and next checks.</text>

  <rect x="100" y="349" width="744" height="70" rx="12" fill="#e8f5ef" stroke="#afcfc0"/>
  <rect x="39" y="362" width="44" height="44" rx="10" fill="#e8f5ef" stroke="#afcfc0"/>
  <path d="M54 376h14v17H54zM57 381h8m-8 4h8m-8 4h5" class="icon"/>
  <text x="120" y="393" class="label">Write the report</text>
  <path d="M362 366V402" stroke="#bbd8cb"/>
  <text x="384" y="379" class="detail">Report supported impact, confidence, and a fix.</text>
  <text x="384" y="403" class="detail">Include a verification step and coverage limits.</text>
</svg>
