<svg xmlns="http://www.w3.org/2000/svg" width="880" height="538" viewBox="0 0 880 538" role="img" aria-labelledby="title description">
  <title id="title">How the Security Audit skill runs</title>
  <desc id="description">The review request and the portable SKILL.md instructions feed a single local session in either Claude Code or Codex. Claude Code uses /security-audit. Codex uses $security-audit or its skill picker. The host supplies the model, project access, tools, and approvals. The session inspects scoped evidence and returns findings, verification steps, and coverage limits.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 8 5 2 9" fill="none" stroke="#345a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #112b3e; }
      .title { font-size: 39px; font-weight: 750; letter-spacing: -1.3px; }
      .label { font-size: 25px; font-weight: 700; letter-spacing: -.35px; }
      .detail { font-size: 20px; fill: #3d586d; }
      .code { font: 19px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #164477; }
      .edge { fill: none; stroke: #345a78; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="536" rx="25" fill="#f6f8fc" stroke="#cbd7e3" stroke-width="2"/>
  <text x="36" y="66" class="title">How the skill runs</text>

  <rect x="36" y="100" width="392" height="82" rx="13" fill="#fff" stroke="#cbd7e3"/>
  <text x="56" y="134" class="label">Review request</text>
  <text x="56" y="161" class="detail">Target, revision, and project context</text>

  <rect x="452" y="100" width="392" height="82" rx="13" fill="#e8f5ef" stroke="#afcfc0"/>
  <text x="472" y="134" class="label">Portable skill</text>
  <text x="472" y="161" class="detail">Shared review method in SKILL.md</text>

  <path d="M232 182V218" class="edge"/>
  <path d="M648 182V218" class="edge"/>
  <rect x="36" y="219" width="808" height="202" rx="16" fill="#eaf1fb" stroke="#92aac6" stroke-width="1.5"/>
  <text x="56" y="255" class="label">Local host session</text>
  <text x="824" y="254" text-anchor="end" class="detail">Choose one host</text>

  <rect x="56" y="273" width="362" height="78" rx="10" fill="#fff" stroke="#c3d1e1"/>
  <text x="75" y="305" class="label">Claude Code</text>
  <text x="75" y="332" class="code">/security-audit</text>

  <text x="440" y="319" text-anchor="middle" class="detail">or</text>

  <rect x="462" y="273" width="362" height="78" rx="10" fill="#fff" stroke="#c3d1e1"/>
  <text x="481" y="305" class="label">Codex</text>
  <text x="481" y="332" class="code">$security-audit<tspan class="detail" font-family="system-ui, sans-serif"> or skill picker</tspan></text>

  <path d="M56 369H824" stroke="#bccde0"/>
  <text x="440" y="397" text-anchor="middle" class="detail">Host supplies the model, project access, tools, and approvals</text>

  <path d="M440 421V454" class="edge"/>
  <rect x="36" y="455" width="808" height="56" rx="12" fill="#e8f5ef" stroke="#afcfc0"/>
  <text x="56" y="491" class="label">Review report</text>
  <text x="824" y="490" text-anchor="end" class="detail">Findings, verification steps, and coverage limits</text>
</svg>
