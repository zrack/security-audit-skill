name: Bug report
description: Report a reproducible problem with the skill or repository tools.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private code, or undisclosed vulnerabilities. For security issues in this repository, use [private vulnerability reporting](https://github.com/zrack/security-audit-skill/security/advisories/new).
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the request or command, a synthetic example, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and revision
      description: Host (Claude Code or Codex), relevant versions, operating system, and repository revision if known.
    validations:
      required: false
